name: verify

# 本仓库没有运行时/开发依赖（src/ 是唯一真源；build.mjs 与 test/ 都是纯 Node 脚本）
# ⇒ 不需要 npm install / lockfile，检出后直接跑门禁即可。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 门禁 ①　产物一致性 / 语法 / 类型声明
        run: node build.mjs --check

      # 测试套件需要 test/fixtures/**/response.txt（约 12MB 的抓包存档，**故意不入库**，
      # 重建方式见 test/README.md「夹具未入库 —— 怎么重建」）⇒ 干净检出里没有这些文件。
      # 有夹具就跑全量；没有就显式跳过并留一条 notice（不让 CI 因"缺夹具"假红）。
      - name: 检查夹具是否已重建
        id: fixtures
        run: |
          if [ -f test/fixtures/p7-stella-notice/response.txt ] && [ -f test/fixtures/p7-stella-notice/response.txt.meta.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未找到 test/fixtures 的抓包存档 ⇒ 跳过测试套件。本地重建夹具后跑：cd test && node all.mjs"
          fi

      - name: 门禁 ②　测试套件（1698 通过 / 0 失败；需本地夹具）
        if: steps.fixtures.outputs.present == 'true'
        working-directory: test
        run: node all.mjs
