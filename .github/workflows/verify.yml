name: verify

# 本仓库没有运行时/开发依赖（src/ 是唯一真源；build.mjs 与 test/ 都是纯 Node 脚本）
# ⇒ 不需要 npm install / lockfile，检出后直接跑门禁即可。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # 三平台矩阵（2026-11-14 跨系统审查后加的）：
    #   ① 本仓库开发机是 Windows、发布产物要给 macOS/Linux 用，但原来只有 ubuntu-latest 一条通道
    #   ② 通知分支（WinRT toast / macOS osascript）、路径解析、换行策略都是**按平台分叉**的代码，
    #      只跑 Linux 等于永远不验证另外两条分支
    #   ③ 不装依赖（纯 Node 脚本 + 已入库夹具）⇒ 三个平台各跑一次成本很低
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: verify (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 门禁 ①　产物一致性 / 语法 / 类型声明
        run: node build.mjs --check

      # 夹具（test/fixtures/**/response.txt，约 14MB 抓包存档）已入库 ⇒ 干净检出即可跑全量套件。
      - name: 门禁 ②　测试套件（全绿）
        working-directory: test
        run: node all.mjs

      # 门禁 ③：「来源域名 vs 代理白名单」守卫（2026-11-11 并入 CI）。
      # 为什么要进 CI：离线夹具测试会绕过宿主代理，「解析器对、域名没登记」可以
      # 长期静默（真实事故：p5x / gf2 / fgo 长期 403 白板），只有真人在面板上才看得出来。
      - name: 门禁 ③　来源域名 vs 代理白名单（全绿）
        run: node tools/check-host-allow.mjs
