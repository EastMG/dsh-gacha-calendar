name: verify

# 本仓库没有运行时/开发依赖（src/ 是唯一真源；build.mjs 与 test/ 都是纯 Node 脚本）
# ⇒ 不需要 npm install / lockfile，检出后直接跑门禁即可。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 门禁 ①　产物一致性 / 语法 / 类型声明
        run: node build.mjs --check

      # 夹具（test/fixtures/**/response.txt，约 14MB 抓包存档）已入库 ⇒ 干净检出即可跑全量套件。
      - name: 门禁 ②　测试套件（全绿）
        working-directory: test
        run: node all.mjs

      # 门禁 ③：「来源域名 vs 代理白名单」守卫（2026-11-11 并入 CI）。
      # 为什么要进 CI：离线夹具测试会绕过宿主代理，「解析器对、域名没登记」可以
      # 长期静默（真实事故：p5x / gf2 / fgo 长期 403 白板），只有真人在面板上才看得出来。
      - name: 门禁 ③　来源域名 vs 代理白名单（全绿）
        run: node tools/check-host-allow.mjs
